name: Verify repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-tool:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: admin-tool

      - name: Test admin tool
        run: pnpm test
        working-directory: admin-tool

      - name: Type-check admin tool
        run: pnpm typecheck
        working-directory: admin-tool

      - name: Lint admin tool
        run: pnpm lint
        working-directory: admin-tool

      - name: Build admin tool
        run: pnpm build
        working-directory: admin-tool

  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint Bicep files
        run: |
          while IFS= read -r file; do
            az bicep lint --file "$file"
          done < <(find infra -name '*.bicep' -type f -print | sort)

      - name: Validate Bicep template
        run: az bicep build --file infra/main.bicep --stdout >/dev/null

  example-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - example-projects/festival-day-weaver
          - example-projects/whats-near-me
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: Build example project
        run: npm run build
        working-directory: ${{ matrix.project }}
